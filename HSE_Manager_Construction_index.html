<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSE Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f2ee;--sf:#fff;--ink:#1d1f21;--mut:#62666b;--ln:#d9d7cf;--ac:#ffc61a;--ok:#2f8f4e;--md:#c98a00;--hi:#d9591f;--cr:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--sf:#222427;--ink:#f1efe8;--mut:#a1a5aa;--ln:#3a3d41;--ok:#5cc47c;--md:#f0b429;--hi:#ff8a52;--cr:#ff6b60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--sf:#222427;--ink:#f1efe8;--mut:#a1a5aa;--ln:#3a3d41;--ok:#5cc47c;--md:#f0b429;--hi:#ff8a52;--cr:#ff6b60;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:780px;margin:0 auto;padding:0 14px 80px}
header{border-top:10px solid var(--ac);padding:14px 0 8px}
h1{font:700 32px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 8px}
h2{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 8px}
.set{display:grid;grid-template-columns:2fr 1fr;gap:8px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:9px 10px;min-height:44px}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none}
button{font:600 15px Barlow,sans-serif;min-height:44px;border-radius:6px;border:1px solid var(--ink);background:var(--sf);color:var(--ink);padding:0 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#1d1f21}
button.lnk{border:none;background:none;color:var(--mut);text-decoration:underline;min-height:36px;padding:0 6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card,.form{background:var(--sf);border:1px solid var(--ln);border-left:8px solid var(--ln);border-radius:8px;padding:12px 14px;margin:10px 0}
.card.Low,.card.ok{border-left-color:var(--ok)}.card.Medium{border-left-color:var(--md)}.card.High{border-left-color:var(--hi)}.card.Critical,.card.bad{border-left-color:var(--cr)}
.fld{margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ln);margin-right:6px}
.chip.bad{background:var(--cr);color:#fff}.chip.ok{background:var(--ok);color:#1d1f21}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.k div{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.k b{display:block;font:700 28px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.br span:first-child{width:130px;flex:none}.br i{display:block;height:14px;background:var(--ac);border-radius:3px;min-width:2px}
.it{border-top:1px solid var(--ln);padding:10px 0}.it p{margin:0 0 6px;font-weight:500}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none}
#t.on{opacity:1}
</style>
</head>
<body>
<div class="w">
<header>
<h1>HSE manager</h1>
<div class="set">
<div><label for="std">Standard in use (type any, edit anytime)</label><input id="std" list="stds"><datalist id="stds"><option value="ISO 45001:2018"><option value="ISO 14001:2015"><option value="OSHA 29 CFR 1926"><option value="OSHA 29 CFR 1910"><option value="ISO 9001:2015"><option value="Company HSE standard"></datalist></div>
<div><label for="co">Company / site</label><input id="co"></div>
</div>
</header>
<nav id="nav"></nav>
<main id="m"></main>
</div>
<div id="t" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const TYPES=["Hazard identified","Unsafe act","Unsafe condition","Near miss","Incident","Accident"],INJ=["Incident","Accident"],SEV=["Low","Medium","High","Critical"];
const TT={"Working at height":"Inspect harness and edge protection before use. Never work above 2 m without protection. Keep tools tied off. Report damaged scaffold at once.","Manual handling":"Test the load first. Keep it close, back straight, bend knees. Use trolleys or team lifts. Do not twist while carrying.","Excavation safety":"Scan for services before digging. Shore or batter sides. Keep spoil and plant back from the edge. Use ladders for access.","Electrical safety":"Check leads and plugs daily. Use RCDs. Isolate and lock off before work. Treat every cable as live until proven dead.","PPE use":"Hard hat, boots, hi-vis and eye protection as required. Check for damage. Replace worn items. Wear it correctly all the time.","Housekeeping":"Clear walkways and stairs. Bin waste as you go. Coil cables. Clean spills at once. A tidy site is a safe site.","Fire and hot works":"No hot work without a permit. Remove or cover combustibles. Know your extinguisher and exit. Fire watch after work.","Plant and vehicles":"Stay out of exclusion zones. Use banksmen when reversing. Make eye contact before crossing. Wear hi-vis."};
const DEF="Access and egress clear and signed\nHousekeeping and waste control\nPPE worn correctly\nScaffolds and edge protection inspected and tagged\nExcavations supported and barriered\nElectrical equipment tested, leads undamaged\nFire extinguishers and emergency exits available\nFirst aid kit stocked, first aider known\nPlant and vehicle routes segregated\nHazardous substances stored with data sheets\nPermits to work in place where required";
const M={
reports:{p:"R",lbl:"Reports",nw:"New report",f:[["type","Report type","s",TYPES],["date","Date","d"],["loc","Location","t"],["by","Reported by","t"],["desc","What was seen or what happened","a"],["sev","Potential severity","s",SEV],["who","Person involved or injured","t",0,INJ],["lost","Lost work days","n",0,INJ],["rec","Recordable injury?","s",["No","Yes"],INJ],["act","Immediate action taken","a"],["root","Root cause (5 Whys)","a"],["st","Status","s",["Open","Closed"]],["close","Closure statement and evidence","a"],["cl","Standard clause (optional)","t"]],h:r=>r.type,s:r=>[r.date,r.loc,r.sev,r.st||"Open"].filter(Boolean).join(", "),b:r=>r.desc,c:r=>r.sev},
capas:{p:"C",lbl:"CAPA",nw:"New CAPA",f:[["title","Action title","t"],["src","Linked report or inspection","s",()=>[""].concat(db.reports.map(r=>r.id),db.insp.map(r=>r.id))],["kind","Type","s",["Corrective","Preventive"]],["act","Action to be taken","a"],["own","Owner","t"],["due","Due date","d"],["st","Status","s",["Open","In progress","Closed"]],["ver","Effectiveness check (after closing)","a"],["cl","Standard clause (optional)","t"]],h:r=>r.title||"(untitled)",s:r=>[r.kind,r.src,r.own,r.due&&"due "+r.due,r.st].filter(Boolean).join(", "),b:r=>r.act,c:r=>r.st!=="Closed"&&r.due&&r.due<today()?"bad":r.st==="Closed"?"ok":""},
talks:{p:"T",lbl:"Toolbox",nw:"Log toolbox talk",f:[["date","Date","d"],["topic","Topic","s",()=>[""].concat(Object.keys(TT))],["by","Presented by","t"],["n","Number of attendees","n"],["pts","Key points","a"],["note","Questions and feedback","a"]],h:r=>r.topic||"Toolbox talk",s:r=>[r.date,r.by,r.n&&r.n+" attended"].filter(Boolean).join(", "),b:r=>r.pts,c:()=>"ok"},
permits:{p:"P",lbl:"Permits",nw:"New permit",f:[["type","Permit type","s",["Hot work","Work at height","Confined space","Excavation","Electrical isolation","Lifting","General"]],["date","Date issued","d"],["loc","Location","t"],["iss","Issued by","t"],["rec","Received by","t"],["desc","Work description and controls","a"],["st","Status","s",["Open","Closed","Cancelled"]],["close","Close-out (date and site check)","t"]],h:r=>r.type,s:r=>[r.date,r.loc,r.st].filter(Boolean).join(", "),b:r=>r.desc,c:r=>r.st==="Open"?"Medium":r.st==="Closed"?"ok":""},
train:{p:"TR",lbl:"Training",nw:"Add training record",f:[["who","Person","t"],["course","Course","t"],["date","Date completed","d"],["exp","Expiry date","d"],["prov","Provider","t"],["cl","Standard clause (optional)","t"]],h:r=>r.who+" - "+r.course,s:r=>[r.date&&"done "+r.date,r.exp&&"expires "+r.exp,r.prov].filter(Boolean).join(", "),b:()=>"",c:r=>!r.exp?"":r.exp<today()?"bad":r.exp<new Date(Date.now()+2592e6).toISOString().slice(0,10)?"High":"ok"}
};
let db={reports:[],capas:[],talks:[],train:[],insp:[],permits:[],hrs:{},n:{},set:{std:"ISO 45001:2018",hours:"",co:"",lists:{}}},tab="ai",ed=null,mo={};
try{const d=JSON.parse(localStorage.getItem("hse")||"null");if(d)db=Object.assign(db,d)}catch(e){}
const save=()=>{try{localStorage.setItem("hse",JSON.stringify(db))}catch(e){}};
const toast=m=>{const t=$("#t");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
$("#std").value=db.set.std;$("#co").value=db.set.co||"";
$("#std").oninput=e=>{db.set.std=e.target.value;save()};$("#co").oninput=e=>{db.set.co=e.target.value;save()};
const TABS=[["ai","Auto"],["reports","Reports"],["capas","CAPA"],["insp","Inspect"],["talks","Toolbox"],["train","Training"],["permits","Permits"],["stats","Stats"],["monthly","Monthly"],["close","Close-out"],["kpi","KPI"],["learn","Learn"],["msg","Client"],["docs","HSE Documents"]];
function nav(){$("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}
function fld(f,v){const[k,l,t,o]=f;let h;
 if(t==="s"){const op=typeof o==="function"?o():o;h=`<select data-k="${k}">${op.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`}
 else if(t==="a")h=`<textarea data-k="${k}">${esc(v)}</textarea>`;
 else h=`<input data-k="${k}" type="${t==="d"?"date":t==="n"?"number":"text"}" ${t==="n"?'min="0"':""} value="${esc(v)}">`;
 return `<div class="fld"><label>${l}</label>${h}</div>`}
function collect(){const o={};document.querySelectorAll("#m [data-k]").forEach(e=>o[e.dataset.k]=e.value);return o}
function form(m){const d=ed.draft,F=M[m].f;
 const first=F.find(f=>f[2]==="s");if(!d.type&&m==="reports")d.type=TYPES[0];
 F.forEach(f=>{if(d[f[0]]==null)d[f[0]]=f[2]==="d"?today():f[2]==="s"?(typeof f[3]==="function"?f[3]():f[3])[0]:""});
 return `<div class="form"><h2>${ed.id?"Edit "+ed.id:M[m].nw}</h2>${F.filter(f=>!f[4]||f[4].includes(d.type)).map(f=>fld(f,d[f[0]])).join("")}<div class="bar"><button class="pri" data-save="${m}">Save</button><button data-cancel>Cancel</button></div></div>`}
function view(m){const X=M[m];let h=`<div class="bar"><button class="pri" data-new="${m}">${X.nw}</button></div>`;
 if(ed&&ed.m===m)h+=form(m);
 const L=db[m].slice().reverse();
 h+=L.length?L.map(r=>`<div class="card ${X.c(r)}"><h2>${esc(r.id)}  ${esc(X.h(r))}</h2><div class="mut">${esc(X.s(r))}</div>${X.b(r)?`<p>${esc(X.b(r))}</p>`:""}${X.c(r)==="bad"&&m==="capas"?'<span class="chip bad">Overdue</span>':""}${X.c(r)==="bad"&&m==="train"?'<span class="chip bad">Expired</span>':""}${X.c(r)==="High"?'<span class="chip">Expires within 30 days</span>':""}<div class="bar" style="margin:4px 0 0"><button class="lnk" data-edit="${r.id}">Edit</button><button class="lnk" data-del="${r.id}">Delete</button></div></div>`).join(""):'<p class="mut">Nothing logged yet.</p>';
 return h}
function items(){return(db.set.lists[db.set.std]||DEF).split("\n").map(s=>s.trim()).filter(Boolean)}
function inspView(){let h=`<h2>Inspection against ${esc(db.set.std)}</h2><details><summary>Edit checklist for this standard</summary><label>One item per line. Saved per standard, so change the standard above to keep separate lists.</label><textarea id="cl" rows="8">${esc(items().join("\n"))}</textarea><button data-savecl>Save checklist</button></details>`;
 h+=`<div class="form"><div class="g2"><div class="fld"><label>Area inspected</label><input id="ia"></div><div class="fld"><label>Inspector</label><input id="ib"></div></div><div class="fld"><label>Date</label><input id="id" type="date" value="${today()}"></div>${items().map((q,i)=>`<div class="it"><p>${esc(q)}</p><div class="g2"><select data-ii="${i}"><option>Pass</option><option>Fail</option><option>N/A</option></select><input data-in="${i}" placeholder="Note"></div></div>`).join("")}<div class="bar"><button class="pri" data-isave>Save inspection</button></div><p class="mut">Each failed item creates a CAPA automatically.</p></div>`;
 h+=db.insp.slice().reverse().map(r=>{const f=r.res.filter(x=>x.r==="Fail").length,t=r.res.filter(x=>x.r!=="N/A").length;return `<div class="card ${f?"bad":"ok"}"><h2>${r.id}  ${esc(r.area)}</h2><div class="mut">${r.date}, ${esc(r.by)}, ${esc(r.std)}</div><p>${t-f} of ${t} passed, ${f} failed.</p><button class="lnk" data-del="${r.id}">Delete</button></div>`}).join("");
 return h}
function stats(){const R=db.reports,hrs=+db.set.hours||0,ij=R.filter(r=>INJ.includes(r.type)),rec=ij.filter(r=>r.rec==="Yes").length,lti=ij.filter(r=>+r.lost>0).length,ld=ij.reduce((a,r)=>a+(+r.lost||0),0);
 const rt=x=>hrs?(x).toFixed(2):"n/a",open=db.capas.filter(c=>c.st!=="Closed"),od=open.filter(c=>c.due&&c.due<today()).length,te=db.train.filter(t=>t.exp&&t.exp<today()).length;
 const pr=db.insp.length?Math.round(100*db.insp.reduce((a,r)=>{const t=r.res.filter(x=>x.r!=="N/A");return a+(t.length?t.filter(x=>x.r==="Pass").length/t.length:1)},0)/db.insp.length)+"%":"n/a";
 const mx=Math.max(1,...TYPES.map(t=>R.filter(r=>r.type===t).length));
 return `<h2>Statistics</h2><div class="fld"><label>Total hours worked (period of this data)</label><input id="hrs" type="number" min="0" value="${esc(db.set.hours)}"></div>
<div class="k"><div><b>${rt(rec*2e5/hrs)}</b>TRIR (per 200,000 h)</div><div><b>${rt(lti*1e6/hrs)}</b>LTIFR (per 1,000,000 h)</div><div><b>${rt(ld*1e6/hrs)}</b>Severity rate (lost days per 1M h)</div><div><b>${ld}</b>Lost work days</div><div><b>${R.length}</b>Reports logged</div><div><b>${R.filter(r=>r.type==="Near miss").length}</b>Near misses</div><div><b>${open.length} (${od} overdue)</b>Open CAPAs</div><div><b>${pr}</b>Avg inspection pass rate</div><div><b>${db.talks.length}</b>Toolbox talks</div><div><b>${te}</b>Expired training records</div></div>
<h2>Reports by type</h2>${TYPES.map(t=>{const n=R.filter(r=>r.type===t).length;return `<div class="br"><span>${t}</span><i style="width:${n/mx*60}%"></i><b>${n}</b></div>`}).join("")}
<div class="bar"><button class="pri" data-copy>Copy summary</button></div><p class="mut">TRIR = recordable injuries x 200,000 / hours. LTIFR = lost-time injuries x 1,000,000 / hours. Confirm which formulas and base your standard or regulator requires.</p>`}
function render(){nav();$("#m").innerHTML=tab==="stats"?stats():tab==="insp"?inspView():tab==="ai"?aiView():tab==="monthly"?monthlyView():tab==="learn"?learnView2():tab==="close"?closeView():tab==="kpi"?kpiView():tab==="msg"?msgView():tab==="docs"?docsView():view(tab);if(tab==="msg")gen()}
$("#nav").onclick=e=>{const t=e.target.dataset.tab;if(t){tab=t;ed=null;render()}};
$("#m").addEventListener("click",e=>{const d=e.target.dataset,m=tab;
 if(d.new){ed={m,id:null,draft:{}};render()}
 else if(d.cancel!==undefined){ed=null;render()}
 else if(d.edit){ed={m,id:d.edit,draft:Object.assign({},db[m].find(r=>r.id===d.edit))};render()}
 else if(d.del){if(e.target.dataset.arm!==d.del){e.target.dataset.arm=d.del;e.target.textContent="Tap again to delete";return}const k=m==="insp"?"insp":m;db[k]=db[k].filter(r=>r.id!==d.del);save();render()}
 else if(d.save){const o=collect(),L=db[m];if(ed.id)Object.assign(L.find(r=>r.id===ed.id),o);else{db.n[m]=(db.n[m]||0)+1;L.push(Object.assign({id:M[m].p+"-"+String(db.n[m]).padStart(3,"0")},o))}save();ed=null;render();toast("Saved")}
 else if(d.savecl!==undefined){db.set.lists[db.set.std]=$("#cl").value;save();render();toast("Checklist saved")}
 else if(d.isave!==undefined){const res=items().map((q,i)=>({q,r:$(`[data-ii="${i}"]`).value,n:$(`[data-in="${i}"]`).value}));db.n.insp=(db.n.insp||0)+1;const id="INS-"+String(db.n.insp).padStart(3,"0");
  db.insp.push({id,area:$("#ia").value||"General",by:$("#ib").value,date:$("#id").value,std:db.set.std,res});
  res.filter(x=>x.r==="Fail").forEach(x=>{db.n.capas=(db.n.capas||0)+1;db.capas.push({id:"C-"+String(db.n.capas).padStart(3,"0"),title:x.q,src:id,kind:"Corrective",act:x.n,own:"",due:"",st:"Open",ver:"",cl:""})});
  save();render();toast("Inspection saved")}
 else if(d.copy!==undefined){const txt=document.querySelectorAll(".k div");const L=[`HSE STATISTICS REPORT`,`Standard: ${db.set.std}`,`Site: ${db.set.co}`,`Date: ${today()}`,`Hours worked: ${db.set.hours||"n/a"}`,""];txt.forEach(x=>{const b=x.querySelector("b");L.push(x.textContent.slice(b.textContent.length)+": "+b.textContent)});const s=L.join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Summary copied")).catch(()=>{const t=document.createElement("textarea");t.value=s;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Summary copied")}catch(_){toast("Copy failed")}t.remove()})}
});
$("#m").addEventListener("change",e=>{const k=e.target.dataset.k;if(!ed||!k)return;
 if(k==="type"||k==="topic"){ed.draft=collect();if(k==="topic"&&!ed.draft.pts)ed.draft.pts=TT[ed.draft.topic]||"";render()}});
$("#m").addEventListener("input",e=>{if(e.target.id==="hrs"){db.set.hours=e.target.value;save()}});
const LS=[
{t:"Hierarchy of controls",b:"Control hazards in this order: eliminate, substitute, engineering controls, administrative controls, then PPE. PPE comes last because it only protects the wearer and depends on correct use.",q:"Fitting guardrails around an open edge is which level?",o:["Elimination","Engineering control","PPE"],a:1,w:"Guardrails physically separate people from the hazard, so they are an engineering control."},
{t:"Risk assessment",b:"Risk = likelihood x severity. Identify the hazard and who is at risk, score it, add controls in hierarchy order, then score the residual risk. Review it whenever the task, people or conditions change.",q:"When must you review a risk assessment?",o:["Only once a year","When the task or conditions change","Never after approval"],a:1,w:"Changes in task, people, equipment or site conditions can make an old assessment invalid."},
{t:"Near miss reporting",b:"A near miss could have caused injury or damage but did not. It is a free lesson. People report more when reports lead to action and the reporter is never blamed.",q:"What best encourages near miss reporting?",o:["Disciplining the person involved","Acting on reports and giving feedback","Only reporting serious ones"],a:1,w:"People report when they see action and feel safe doing it."},
{t:"Incident investigation",b:"Make the scene safe and care for the injured first. Then collect facts, interview witnesses and find root causes with 5 Whys or a fishbone. Look for system gaps such as missing controls, training or supervision, not just individual error. Finish with CAPA.",q:"The best end point of an investigation is...",o:["Naming who is at fault","Actions that fix the root causes","Closing the file quickly"],a:1,w:"The goal is to prevent recurrence by fixing system causes."},
{t:"Permit to work and stop work",b:"High-risk work (hot works, confined space, work at height, electrical isolation) needs a permit confirming hazards, controls, isolation and who is accountable. Everyone has the authority to stop work if it is unsafe, without penalty.",q:"A worker sees an unguarded edge. What should they do?",o:["Finish the job first","Stop work and report it","Work around it carefully"],a:1,w:"Stop work authority exists for exactly this situation."},
{t:"CAPA that works",b:"A corrective action fixes an existing problem. A preventive action stops a possible one. Give each an owner and a due date, then check later that it worked. Closing the task is not the same as proving the problem is gone.",q:"Why add an effectiveness check?",o:["To prove the fix actually worked","To delay closure","It is optional paperwork"],a:0,w:"Without a check you cannot know the same event will not happen again."}
];
function learnView(){const d=db.learn||{};return `<h2>Learn: HSE officer basics</h2><p class="mut">Open a lesson and answer the question. Completed: <b id="lp">${Object.keys(d).length}</b> of ${LS.length}</p>`+LS.map((L,i)=>`<details class="card ${d[i]?"ok":""}"><summary>${i+1}. ${L.t}</summary><p>${L.b}</p><p><b>${L.q}</b></p>${L.o.map((o,j)=>`<div class="bar" style="margin:4px 0"><button data-ans="${i}:${j}">${o}</button></div>`).join("")}<p id="fb${i}" class="mut"></p></details>`).join("")}
$("#m").addEventListener("click",e=>{const a=e.target.dataset.ans;if(a===undefined)return;const[li,oi]=a.split(":").map(Number),L=LS[li],ok=oi===L.a;if(ok){db.learn=db.learn||{};db.learn[li]=1;save()}const f=$("#fb"+li);f.textContent=(ok?"Correct. ":"Not quite. ")+L.w;f.style.color=ok?"var(--ok)":"var(--cr)";$("#lp").textContent=Object.keys(db.learn||{}).length});
const SC={

function learnView2(){const tr=TR.find(x=>x[0]===curT),d=db.learn||{},all=TR.reduce((a,x)=>a+x[2].length,0),dn=TR.reduce((a,x)=>a+doneN(x[0]),0);
 return `<h2>Learn</h2><p class="mut">Overall: <b id="lp">${dn}</b> of ${all} lessons completed. These are study summaries, not legal advice or official course material. Check current law and the official syllabus for any exam.</p><div class="fld"><label>Course</label><select id="lt">${TR.map(([k,n,L])=>`<option value="${k}" ${k===curT?"selected":""}>${n} (${doneN(k)}/${L.length})</option>`).join("")}</select></div>`+tr[2].map((L,i)=>`<details class="card ${d[curT+":"+i]?"ok":""}"><summary>${i+1}. ${L.t}</summary><p>${L.b}</p><p><b>${L.q}</b></p>${L.o.map((o,j)=>`<div class="bar" style="margin:4px 0"><button data-qa="${curT}:${i}:${j}">${o}</button></div>`).join("")}<p id="fb-${curT}-${i}" class="mut"></p></details>`).join("")}
$("#m").addEventListener("change",e=>{if(e.target.id==="lt"){curT=e.target.value;render()}});
$("#m").addEventListener("click",e=>{const a=e.target.dataset.qa;if(a===undefined)return;const[k,i,j]=a.split(":"),L=TR.find(x=>x[0]===k)[2][+i],ok=+j===L.a;
 if(ok){db.learn=db.learn||{};db.learn[k+":"+i]=1;save()}
 const f=$("#fb-"+k+"-"+i);f.textContent=(ok?"Correct. ":"Not quite. ")+L.w;f.style.color=ok?"var(--ok)":"var(--cr)";
 $("#lp").textContent=TR.reduce((a,x)=>a+doneN(x[0]),0)});

const DOC_ACT={
"Work at height":"Pre-task review of access, edge protection, fragile surfaces, weather, dropped-object controls, inspected fall-protection equipment, anchorage compatibility and rescue plan.",
"Lifting and rigging":"Verify load weight/centre of gravity, lifting points, crane configuration and load chart at actual radius, ground/outrigger capacity, rigging WLL, inspection certificates, competent crew, communications and exclusion zone.",
"Hot work":"Approved hot-work permit, combustibles removed or shielded, gas cylinders secured, flashback protection as applicable, ventilation/fume controls, fire extinguisher, fire watch and post-work fire check.",
"Fire safety":"Ignition-source control, housekeeping, safe fuel/gas storage, suitable extinguishers, alarm/escape routes, assembly point, emergency contacts and trained response team.",
"Scaffolding":"Competent erection/alteration, firm foundation, base plates/sole boards, bracing/ties, platform/decking, guardrails/toeboards, safe access, load rating, inspection/tag and exclusion during erection.",
"Confined space":"Avoid entry if possible; permit, positive isolation, atmospheric testing, ventilation, attendant, communication, entry log, suitable PPE and tested rescue plan/equipment.",
"Excavation":"Permit and service detection, soil/ground assessment, protective system, edge barriers, safe access/egress, spoil/plant setback, water control and competent-person inspections.",
"Electrical work":"Authorised electrician, identify sources, isolate-lock-tag, discharge stored energy, prove tester/test for dead, earthing/RCD protection, insulated tools, barriers and controlled re-energisation.",
"PTW":"Define scope/location/duration, hazards, risk assessment, isolations, precautions, gas tests, authorised issuer/receiver, SIMOPS, emergency arrangements, handback and formal close-out."
};
function docsView(){
 const d=db.set.doc||{kind:"HIRA",act:"Work at height"};
 const acts=Object.keys(DOC_ACT);
 return `<h2>HSE document preparation</h2><p class="mut">Prepare editable first drafts for site review. Complete site-specific values, verify controls with competent persons and obtain required approvals before work starts.</p>
 <div class="form">
 <div class="g2"><div class="fld"><label>Document type</label><select id="dk">${["HIRA","JSA","WMS / Method Statement","Lifting Plan"].map(x=>`<option ${d.kind===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="fld"><label>Activity</label><select id="da">${acts.map(x=>`<option ${d.act===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
 <div class="fld"><label>Project / site</label><input id="ds" value="${esc(d.site||db.set.co||"")}" placeholder="Project and site"></div>
 <div class="g2"><div class="fld"><label>Exact work location</label><input id="dl" value="${esc(d.loc||"")}" placeholder="Building / level / grid"></div><div class="fld"><label>Date / revision</label><input id="dd" type="date" value="${esc(d.date||today())}"></div></div>
 <div class="fld"><label>Work scope and sequence</label><textarea id="dw" rows="3" placeholder="Describe exact task, equipment and work sequence">${esc(d.scope||"")}</textarea></div>
 <div class="fld"><label>People, roles and competency</label><textarea id="dp" rows="2" placeholder="Supervisor, workers, operator, rigger, attendant, electrician...">${esc(d.people||"")}</textarea></div>
 <div class="fld"><label>Equipment / materials / load details (as applicable)</label><textarea id="de" rows="2" placeholder="Tools, PPE, crane details, load weight, lifting accessories...">${esc(d.equip||"")}</textarea></div>
 <div class="fld"><label>Site-specific hazards / conditions</label><textarea id="dh" rows="3" placeholder="Weather, nearby work, access, services, ground, adjacent operations...">${esc(d.hazards||"")}</textarea></div>
 <div class="fld"><label>Additional controls / emergency and rescue arrangements</label><textarea id="dc" rows="3" placeholder="Rescue method, emergency contacts, first aid, fire response, isolation...">${esc(d.controls||"")}</textarea></div>
 <div class="bar"><button class="pri" data-dgen>Generate draft</button><button data-dcopy>Copy draft</button></div>
 <p class="mut">Activity-specific minimum planning prompts: ${esc(DOC_ACT[d.act]||"")}</p></div>
 <div class="form"><h2>Editable document draft</h2><textarea id="dout" rows="22">${esc(d.output||"Select the document type and activity, complete the fields, then select Generate draft.")}</textarea></div>`;
}
function buildDoc(){
 const g=id=>$("#"+id)?.value||"",kind=g("dk"),act=g("da"),site=g("ds"),loc=g("dl"),date=g("dd"),scope=g("dw"),people=g("dp"),equip=g("de"),haz=g("dh"),ctrl=g("dc");
 const common=`PROJECT / SITE: ${site||"[confirm]"}\nLOCATION: ${loc||"[confirm]"}\nDATE / REVISION: ${date||today()}\nACTIVITY: ${act}\nSCOPE: ${scope||"[define exact scope and sequence]"}\nPERSONNEL / COMPETENCE: ${people||"[list authorised and competent personnel]"}\nEQUIPMENT / MATERIALS: ${equip||"[verify equipment and certificates]"}\nSITE CONDITIONS: ${haz||"[inspect and confirm on site]"}\n`;
 const controls=DOC_ACT[act]+"\n"+(ctrl||"[add site-specific controls and emergency arrangements]");
 let out=`${kind.toUpperCase()} – CONSTRUCTION SITE DRAFT\n${"=".repeat(42)}\n${common}\nPRE-START REQUIREMENTS\n1. Approved risk assessment / method statement and applicable PTW.\n2. Conduct site walkdown, toolbox talk and confirm worker competency.\n3. Inspect tools, plant, PPE and safety devices; remove defective items.\n4. Coordinate simultaneous operations and establish barricades/signage.\n5. Confirm emergency communication, first aid and stop-work arrangements.\n\nACTIVITY HAZARDS AND CONTROL PROMPTS\n${controls}\n\n`;
 if(kind==="HIRA") out+=`HIRA – INITIAL AND RESIDUAL RISK REGISTER\nUse the site's approved matrix. Illustrative scale: Likelihood 1–5 × Severity 1–5. Do not treat these example ratings as approved scores.\n\nStep / hazard | Persons at risk | Initial L | Initial S | Initial score | Controls (hierarchy) | Residual L | Residual S | Residual score | Owner\n1. Mobilisation and access | Workers / visitors | [ ] | [ ] | [ ] | [site-specific controls] | [ ] | [ ] | [ ] | [ ]\n2. Main work activity | Work crew / others | [ ] | [ ] | [ ] | ${controls} | [ ] | [ ] | [ ] | [ ]\n3. Completion / demobilisation | Workers / others | [ ] | [ ] | [ ] | Housekeeping, remove tools, restore barriers only when safe | [ ] | [ ] | [ ] | [ ]\nReview risk scores against the approved project matrix and accept residual risk only through authorised review.\n`;
 else if(kind==="JSA") out+=`JOB SAFETY ANALYSIS – TASK BREAKDOWN\nNo. | Job step | Hazard / possible consequence | Required safe method and controls | Responsible person\n1 | Pre-start / mobilisation | Unbriefed crew, unsuitable equipment, SIMOPS | Verify permit, drawings, competency, equipment inspection and toolbox talk | Supervisor\n2 | Set up work area | Unauthorised access, dropped objects, vehicle interface | Barricade, signage, exclusion zone, safe access and housekeeping | Supervisor / banksman\n3 | Perform task: ${scope||act} | ${haz||"[identify hazards at each step]"} | ${controls} | Task supervisor\n4 | Stop / make safe | Stored energy, unstable work, incomplete handback | Stop safely, isolate as required, account for tools/personnel and secure area | Supervisor\n5 | Close out | Residual hazards, waste, unauthorised restart | Inspect area, remove waste, close permit and hand back worksite | Permit issuer / receiver\n`;
 else if(kind==="WMS / Method Statement") out+=`WORK METHOD STATEMENT – SAFE SEQUENCE\n1. Planning: review approved drawings, scope, access, interfaces and site constraints.\n2. Authorisation: approve this method statement and HIRA/JSA; obtain relevant PTW and isolations.\n3. Resources: confirm competent supervisor and workforce, plant, inspected tools, materials and PPE.\n4. Work area: conduct walkdown; locate services; install barriers, signs and safe access.\n5. Execution: follow the approved sequence and activity-specific controls above. Supervisor monitors continuously.\n6. Change control: stop if scope, weather, equipment, personnel or conditions change; reassess and reauthorise.\n7. Completion: inspect, remove temporary controls only when safe, clear waste, close permits and hand back.\nHOLD POINTS: Do not start without approvals; do not proceed with failed inspections, missing controls or unsafe conditions.\n`;
 else out+=`LIFTING PLAN – COMPLETE BEFORE THE LIFT\nLift classification: [routine / non-routine / critical – per project criteria]\nLoad description: [ ]   Verified load weight: [ ]   Dimensions: [ ]\nCentre of gravity / lifting points: [ ]   Load path and landing area: [ ]\nCrane make/model/ID: [ ]   Configuration / counterweight / reeving: [ ]\nWorking radius: [ ]   Boom length: [ ]   Chart capacity at configuration/radius: [ ]\nUtilisation: [calculate per approved procedure]   Ground bearing pressure / outrigger mat design: [ ]\nRigging arrangement sketch/reference: [ ]   Sling type/angle/WLL: [ ]   Shackles/hooks: [ ]\nCertificates and pre-use inspections verified by: [ ]\nAppointed person / lift planner: [ ]   Lift supervisor: [ ]   Operator: [ ]\nRigger / slinger: [ ]   Signaller: [ ]   Communication method: [ ]\nExclusion zone and access control: [ ]   Weather / wind limit per manufacturer: [ ]\nTrial lift and balance check: [ ]   Emergency / recovery plan: [ ]\nMANDATORY HOLD POINTS: verify load weight and lifting points; check crane chart for actual configuration and radius; confirm ground/outrigger capacity; inspect certified lifting accessories; conduct briefing; establish exclusion zone. Never lift over people or permit anyone beneath a suspended load.\n`;
 out+=`\nAPPROVALS / BRIEFING\nPrepared by: [name / designation / signature / date]\nReviewed by competent person: [name / designation / signature / date]\nApproved by authorised site representative: [name / designation / signature / date]\nToolbox talk conducted and crew acknowledgement: [attach attendance]\nPermit number / validity: [ ]\n\nIMPORTANT: This is a planning template, not an approved permit or engineered lift plan. Verify all dimensions, weights, capacities, soil/ground conditions, atmospheric test limits, statutory requirements and project procedures. Obtain competent-person and client approvals before work.`;
 $("#dout").value=out;
 db.set.doc={kind,act,site,loc,date,scope,people,equip,hazards:haz,controls:ctrl,output:out};save();
}
$("#m").addEventListener("click",e=>{
 if(e.target.dataset.dgen!==undefined)buildDoc();
 if(e.target.dataset.dcopy!==undefined){const out=$("#dout");if(out)copyTxt(out.value,"Document draft copied")}
});
$("#m").addEventListener("input",e=>{
 if(e.target.id==="dout"){db.set.doc=db.set.doc||{};db.set.doc.output=e.target.value;save()}
});
$("#m").addEventListener("change",e=>{
 if(["dk","da","ds","dl","dd","dw","dp","de","dh","dc"].includes(e.target.id)){
 const d=db.set.doc||{};const map={dk:"kind",da:"act",ds:"site",dl:"loc",dd:"date",dw:"scope",dp:"people",de:"equip",dh:"hazards",dc:"controls"};
 d[map[e.target.id]]=e.target.value;db.set.doc=d;save();
 }
});

render();
</script>
</body>
</html>
